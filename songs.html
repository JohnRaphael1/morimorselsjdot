<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Songs | MoriMorsels JDot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- PWA / App Icons -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8b0000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MoriMorsels">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<style>
.page-header { padding: calc(var(--nav-height) + 80px) 24px 40px; text-align: center; }
.page-sub { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 14px; }
.filter-bar { display: flex; justify-content: center; gap: 12px; margin-bottom: 50px; flex-wrap: wrap; }
.filter-btn {
  padding: 11px 24px; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.18em;
  text-transform: uppercase; border: 1px solid var(--glass-border); border-radius: 8px;
  background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  color: var(--muted); cursor: pointer; transition: all 0.3s var(--ease); font-family: var(--font-body);
}
.filter-btn:hover { color: #fff; border-color: var(--red-1); }
.filter-btn.active { background: var(--red-1); color: #fff; border-color: var(--red-bright); box-shadow: 0 0 22px var(--red-glow); }
.songs-list { max-width: 900px; margin: 0 auto; }
.song-row {
  display: grid; grid-template-columns: 70px 1fr 40px; gap: 16px; align-items: center;
  padding: 16px 20px; margin-bottom: 10px;
  background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border); border-radius: var(--radius);
  transition: all 0.3s var(--ease); cursor: pointer;
}
.song-row:hover { border-color: var(--red-bright); box-shadow: 0 0 28px rgba(139, 0, 0, 0.4); transform: translateX(4px); }
.song-cover { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; border: 1px solid var(--glass-border); }
.song-info h3 { font-size: 1rem; font-weight: 700; color: var(--text-bright); margin-bottom: 4px; }
.song-info p { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.arrow { color: var(--red-bright); font-size: 1.4rem; text-align: center; transition: transform 0.3s; }
.song-row:hover .arrow { transform: translateX(4px); }
.latest-tag {
  display: inline-block; padding: 2px 10px; border-radius: 20px;
  background: var(--red-bright); color: #fff;
  font-size: 0.55rem; font-weight: 900; letter-spacing: 0.2em;
  text-transform: uppercase; margin-left: 10px;
  box-shadow: 0 0 14px var(--red-bright); vertical-align: middle;
  animation: pulseLatest 2s ease-in-out infinite;
}
@keyframes pulseLatest {
  0%,100% { box-shadow: 0 0 14px var(--red-bright); }
  50% { box-shadow: 0 0 26px var(--red-bright), 0 0 40px var(--red-glow); }
}
.status-text { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase; }
.songs-note { text-align: center; margin-top: 50px; color: var(--muted); font-size: 0.82rem; letter-spacing: 0.1em; }
@media (max-width: 640px) {
  .song-row { grid-template-columns: 55px 1fr 30px; padding: 14px; gap: 12px; }
  .song-cover { width: 55px; height: 55px; }
  .song-info h3 { font-size: 0.9rem; }
  .song-info p { font-size: 0.65rem; }
  .filter-btn { padding: 9px 16px; font-size: 0.6rem; }
}
</style>
</head>
<body>

<div class="bg-layer bg-gradient"></div>
<div class="bg-layer bg-glow"></div>
<div class="bg-layer bg-noise"></div>
<canvas id="particles"></canvas>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-logo">
      <span class="logo-mark">M</span>
      <span class="logo-text">MORIMORSELS <em>JDOT</em></span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="music.html">Music</a></li>
      <li><a href="videos.html">Videos</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="songs.html">All Songs</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
    <button class="nav-toggle" aria-label="Menu">☰</button>
  </div>
</nav>

<header class="page-header">
  <div class="container">
    <p class="section-eyebrow">COMPLETE CATALOG</p>
    <h1 class="section-title">ALL SONGS</h1>
    <p class="page-sub">Tap any release for full details</p>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="single">Singles</button>
      <button class="filter-btn" data-filter="album">Albums</button>
      <button class="filter-btn" data-filter="ep">EPs</button>
    </div>
    <div class="songs-list" id="songs-container">
      <p class="status-text">Loading songs…</p>
    </div>
    <p class="songs-note">Full catalog available on all streaming platforms.</p>
  </div>
</section>

<script src="script.js"></script>

<script>
(function () {
  'use strict';

  if (localStorage.getItem('mmjd_logged') === 'yes') {
    var a = document.getElementById('nav-admin');
    if (a) a.style.display = '';
  }

  var $  = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function formatDate(dateStr) {
    if (!dateStr) return 'Unknown date';
    var parts = String(dateStr).split('-');
    var year = parts[0];
    var month = parts[1] ? parseInt(parts[1], 10) : 1;
    var day = parts[2] ? parseInt(parts[2], 10) : null;
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var m = months[(month - 1 + 12) % 12] || 'Jan';
    return day ? (m + ' ' + day + ', ' + year) : (m + ' ' + year);
  }

  function formatType(type) {
    if (!type) return 'Single';
    var t = String(type).toLowerCase();
    if (t === 'album') return 'Album';
    if (t === 'single') return 'Single';
    if (t === 'ep') return 'EP';
    return t.charAt(0).toUpperCase() + t.slice(1);
  }

  function renderSongs(releases) {
    var container = $('#songs-container');
    if (!container) return;

    if (!releases || releases.length === 0) {
      container.innerHTML = '<p class="status-text">No releases yet. Check back soon.</p>';
      return;
    }

    var sorted = releases.slice().sort(function (a, b) {
      return (b.release_date || '').localeCompare(a.release_date || '');
    });
    var latestName = sorted[0] ? sorted[0].name : null;

    container.innerHTML = sorted.map(function (song) {
      var isLatest = song.name === latestName;
      var type = song.type || 'single';
      var feat = song.featured ? ' (feat. ' + escapeHtml(song.featured) + ')' : '';
      var coverHtml = song.cover
        ? '<img class="song-cover" src="' + escapeHtml(song.cover) + '" alt="">'
        : '<div class="song-cover" style="background:linear-gradient(135deg,#5c0000,#2a0000);"></div>';

      return '' +
        '<div class="song-row" data-type="' + escapeHtml(type) + '" data-id="' + escapeHtml(song.id) + '">' +
          coverHtml +
          '<div class="song-info">' +
            '<h3>' + escapeHtml(song.name) + feat + (isLatest ? '<span class="latest-tag">Latest</span>' : '') + '</h3>' +
            '<p>' + formatType(type) + ' · ' + (song.total_tracks || 1) + ' Song' + ((song.total_tracks || 1) > 1 ? 's' : '') + ' · ' + formatDate(song.release_date) + '</p>' +
          '</div>' +
          '<div class="arrow">→</div>' +
        '</div>';
    }).join('');

    $$('.song-row').forEach(function (row) {
      row.addEventListener('click', function () {
        var id = row.getAttribute('data-id');
        if (id) window.location.href = 'song.html?id=' + encodeURIComponent(id);
      });
    });

    initFilter();
  }

  function initFilter() {
    var btns = $$('.filter-btn');
    var rows = $$('.song-row');
    btns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var filter = btn.getAttribute('data-filter');
        btns.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        rows.forEach(function (row) {
          var type = row.getAttribute('data-type');
          row.style.display = (filter === 'all' || type === filter) ? 'grid' : 'none';
        });
      });
    });
  }

  async function loadSongs() {
    try {
      var res = await fetch('/api/songs');
      var releases = await res.json();
      renderSongs(releases);
    } catch (err) {
      var container = $('#songs-container');
      if (container) container.innerHTML = '<p class="status-text">Could not load songs. Try again shortly.</p>';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadSongs);
  } else {
    loadSongs();
  }
})();
</script>

</body>
</html>
