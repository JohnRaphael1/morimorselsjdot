<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | MoriMorsels JDot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- PWA / App Icons -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8b0000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MoriMorsels">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<style>
.admin-wrap { max-width: 760px; margin: 0 auto; }
.admin-card {
  background: var(--glass-bg-strong);
  backdrop-filter: var(--glass-blur-strong);
  -webkit-backdrop-filter: var(--glass-blur-strong);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 36px;
  box-shadow: 0 0 40px rgba(139, 0, 0, 0.2);
}
.admin-card h2 {
  font-family: var(--font-display);
  font-size: 1.6rem;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin-bottom: 24px;
  color: var(--text-bright);
}
.admin-input {
  width: 100%;
  padding: 13px 16px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  color: #fff;
  font-family: var(--font-body);
  font-size: 0.9rem;
  transition: all 0.3s var(--ease);
}
.admin-input:focus {
  outline: none;
  border-color: var(--red-bright);
  box-shadow: 0 0 20px rgba(139, 0, 0, 0.45);
}
.admin-label {
  display: block;
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--red-bright);
  margin-bottom: 8px;
  margin-top: 18px;
}
.admin-msg {
  padding: 14px;
  border-radius: 8px;
  margin-top: 20px;
  font-size: 0.85rem;
  display: none;
}
.admin-msg.show { display: block; }
.admin-msg.ok { background: rgba(0, 128, 0, 0.15); border: 1px solid #0a5c0a; color: #7fdc7f; }
.admin-msg.err { background: rgba(139, 0, 0, 0.15); border: 1px solid var(--red-1); color: #ff9e9e; }
.admin-msg.info { background: rgba(139, 139, 0, 0.15); border: 1px solid #5c5c0a; color: #dcdc7f; }
.preview-box {
  display: none;
  margin-top: 20px;
  padding: 18px;
  border-radius: 10px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  gap: 16px;
  align-items: center;
}
.preview-box.show { display: flex; }
.preview-box img { width: 90px; height: 90px; border-radius: 8px; object-fit: cover; }
.preview-box .pv-info h4 { color: #fff; font-size: 1rem; margin-bottom: 4px; }
.preview-box .pv-info p { color: var(--muted); font-size: 0.75rem; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.track-input-row {
  display: grid;
  grid-template-columns: 30px 1fr auto;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.track-input-row span { color: var(--muted); font-size: 0.75rem; }
.track-input-row button {
  background: rgba(139, 0, 0, 0.3);
  border: 1px solid var(--red-1);
  color: #ff9e9e;
  width: 30px; height: 30px;
  border-radius: 50%;
  cursor: pointer;
}
.add-track-btn {
  padding: 10px;
  background: var(--glass-bg);
  border: 1px dashed var(--glass-border);
  border-radius: 8px;
  color: var(--muted);
  cursor: pointer;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  width: 100%;
  margin-top: 8px;
}
.add-track-btn:hover { border-color: var(--red-bright); color: #fff; }
.admin-song {
  display: grid;
  grid-template-columns: 60px 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 14px;
  margin-bottom: 10px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
}
.admin-song img { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; }
.admin-song .info h4 { color: #fff; font-size: 0.9rem; margin-bottom: 3px; }
.admin-song .info p { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; }
.admin-song .del {
  background: rgba(139, 0, 0, 0.3);
  border: 1px solid var(--red-1);
  color: #ff9e9e;
  width: 34px; height: 34px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 0.95rem;
}
.admin-song .del:hover { background: var(--red-bright); color: #fff; }

.admin-nav {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.admin-nav a,
.admin-nav button {
  flex: 1;
  min-width: 130px;
  text-align: center;
  padding: 12px 16px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  color: var(--muted);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  transition: all 0.3s var(--ease);
  cursor: pointer;
  font-family: var(--font-body);
}
.admin-nav a:hover,
.admin-nav button:hover { color: #fff; border-color: var(--red-1); }
.admin-nav a.active {
  background: var(--red-1);
  color: #fff;
  border-color: var(--red-bright);
  box-shadow: 0 0 22px var(--red-glow);
}
.admin-nav button.logout {
  border-color: #500;
  color: #ff9e9e;
}
.admin-nav button.logout:hover {
  background: #500;
  color: #fff;
  border-color: var(--red-bright);
}

@media (max-width: 640px) {
  .admin-card { padding: 22px; }
  .row-2, .row-3 { grid-template-columns: 1fr; }
  .admin-nav a, .admin-nav button { min-width: 100%; }
}
</style>
</head>
<body>

<div class="bg-layer bg-gradient"></div>
<div class="bg-layer bg-glow"></div>
<div class="bg-layer bg-noise"></div>
<canvas id="particles"></canvas>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-logo">
      <span class="logo-mark">M</span>
      <span class="logo-text">MORIMORSELS <em>JDOT</em></span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="music.html">Music</a></li>
      <li><a href="videos.html">Videos</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="songs.html">All Songs</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="admin.html" class="active">Admin</a></li>
    </ul>
    <button class="nav-toggle" aria-label="Menu">☰</button>
  </div>
</nav>

<div id="login-screen" class="section" style="padding-top: 140px;">
  <div class="container">
    <div class="admin-wrap">
      <div class="admin-card">
        <h2>Admin Login</h2>
        <label class="admin-label">Login ID</label>
        <input id="login-id" class="admin-input" type="text" placeholder="Enter login ID">
        <label class="admin-label">Password</label>
        <input id="login-pass" class="admin-input" type="password" placeholder="Enter password">
        <button id="login-btn" class="btn btn-primary full" style="margin-top: 20px;">Login</button>
        <div id="login-msg" class="admin-msg err"></div>
      </div>
    </div>
  </div>
</div>

<div id="admin-panel" class="section" style="padding-top: 140px; display: none;">
  <div class="container">
    <div class="admin-wrap">

      <div class="admin-nav">
        <a href="admin.html" class="active">Songs</a>
        <a href="admin-videos.html">Videos</a>
        <a href="admin-gallery.html">Gallery</a>
        <button class="logout" id="logout-btn">Logout</button>
      </div>

      <div class="admin-card">
        <h2>Add a Release</h2>

        <label class="admin-label">Paste Spotify or Apple Music Link</label>
        <input id="sp-link" class="admin-input" type="text" placeholder="https://open.spotify.com/... OR https://music.apple.com/...">
        <button id="fetch-btn" class="btn btn-outline full" style="margin-top: 14px;">Auto-Fetch</button>

        <div id="preview-box" class="preview-box">
          <img id="pv-img" src="" alt="">
          <div class="pv-info">
            <h4 id="pv-title">—</h4>
            <p id="pv-artist">—</p>
            <p id="pv-meta" style="color: var(--muted); font-size: 0.7rem; margin-top: 4px;"></p>
          </div>
        </div>

        <div id="form-fields" style="display: none; margin-top: 10px; border-top: 1px solid var(--glass-border); padding-top: 20px;">

          <label class="admin-label">Release Name *</label>
          <input id="in-name" class="admin-input" type="text" placeholder="Song / EP / Album name">

          <div class="row-2">
            <div>
              <label class="admin-label">Main Artist</label>
              <input id="in-artist" class="admin-input" type="text">
            </div>
            <div>
              <label class="admin-label">Featured Artist(s)</label>
              <input id="in-featured" class="admin-input" type="text" placeholder="Comma separated">
            </div>
          </div>

          <label class="admin-label">Cover Image URL</label>
          <input id="in-cover" class="admin-input" type="text">

          <div class="row-3">
            <div>
              <label class="admin-label">Release Date *</label>
              <input id="in-date" class="admin-input" type="date">
            </div>
            <div>
              <label class="admin-label">Type *</label>
              <select id="in-type" class="admin-input">
                <option value="single">Single</option>
                <option value="ep">EP</option>
                <option value="album">Album</option>
              </select>
            </div>
            <div>
              <label class="admin-label">Total Tracks *</label>
              <input id="in-tracks" class="admin-input" type="number" min="1" value="1">
            </div>
          </div>

          <div class="row-2">
            <div>
              <label class="admin-label">Genre</label>
              <input id="in-genre" class="admin-input" type="text">
            </div>
            <div>
              <label class="admin-label">Record Label</label>
              <input id="in-label" class="admin-input" type="text" placeholder="Manual">
            </div>
          </div>

          <label class="admin-label">Producer</label>
          <input id="in-producer" class="admin-input" type="text" placeholder="Manual">

          <label class="admin-label">Tracklist (for EP / Album)</label>
          <div id="tracklist-container"></div>
          <button type="button" class="add-track-btn" id="add-track-btn">+ Add Track</button>

          <button id="save-btn" class="btn btn-primary full" style="margin-top: 24px;">Save Release</button>
        </div>

        <div id="admin-msg" class="admin-msg"></div>
      </div>

      <div style="margin-top: 40px;">
        <h2 style="font-family: var(--font-display); color: #fff; text-transform: uppercase; margin-bottom: 20px;">Added Releases</h2>
        <div id="release-list"></div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>

<script>
(function () {
  'use strict';

  var ADMIN_ID = 'MMJD2026';
  var ADMIN_PASS = 'MMJDOT';
  var currentUrl = '';

  var $ = function (s) { return document.querySelector(s); };

  if (localStorage.getItem('mmjd_logged') === 'yes') showPanel();

  $('#login-btn').addEventListener('click', function () {
    var id = $('#login-id').value.trim();
    var pw = $('#login-pass').value.trim();
    if (id === ADMIN_ID && pw === ADMIN_PASS) {
      localStorage.setItem('mmjd_logged', 'yes');
      showPanel();
    } else {
      var msg = $('#login-msg');
      msg.textContent = 'Wrong login ID or password.';
      msg.className = 'admin-msg err show';
    }
  });

  function showPanel() {
    $('#login-screen').style.display = 'none';
    $('#admin-panel').style.display = 'block';
    renderList();
  }

  $('#logout-btn').addEventListener('click', function () {
    localStorage.removeItem('mmjd_logged');
    location.reload();
  });

  function addTrackRow(value) {
    var container = $('#tracklist-container');
    var row = document.createElement('div');
    row.className = 'track-input-row';
    row.innerHTML =
      '<span></span>' +
      '<input class="admin-input" type="text" placeholder="Track name" value="' + (value || '').replace(/"/g, '&quot;') + '">' +
      '<button type="button">✕</button>';
    row.querySelector('button').addEventListener('click', function () {
      row.remove();
      renumber();
    });
    container.appendChild(row);
    renumber();
  }

  function renumber() {
    var rows = document.querySelectorAll('.track-input-row');
    rows.forEach(function (r, i) {
      r.querySelector('span').textContent = (i + 1) + '.';
    });
    $('#in-tracks').value = rows.length || 1;
  }

  $('#add-track-btn').addEventListener('click', function () { addTrackRow(''); });

  $('#fetch-btn').addEventListener('click', async function () {
    var url = $('#sp-link').value.trim();
    if (!url) { showMsg('Paste a link first.', 'err'); return; }

    showMsg('Fetching…', 'info');

    try {
      var res = await fetch('/api/fetch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url })
      });

      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Fetch failed');

      currentUrl = url;

      $('#pv-img').src = data.cover || '';
      $('#pv-title').textContent = data.name || '—';
      $('#pv-artist').textContent = (data.artist || '') + (data.featured ? ' feat. ' + data.featured : '');
      $('#pv-meta').textContent = (data.type || '').toUpperCase() + ' · ' + (data.total_tracks || 1) + ' track(s) · ' + (data.release_date || '');
      $('#preview-box').classList.add('show');

      $('#in-name').value = data.name || '';
      $('#in-artist').value = data.artist || 'MoriMorsels JDot';
      $('#in-featured').value = data.featured || '';
      $('#in-cover').value = data.cover || '';
      $('#in-date').value = data.release_date || '';
      $('#in-type').value = data.type || 'single';
      $('#in-tracks').value = data.total_tracks || 1;
      $('#in-genre').value = data.genre || '';
      $('#in-label').value = data.label || '';
      $('#in-producer').value = data.producer || '';

      $('#tracklist-container').innerHTML = '';
      if (data.tracklist && data.tracklist.length) {
        data.tracklist.forEach(function (t) { addTrackRow(t); });
      }

      $('#form-fields').style.display = 'block';
      showMsg('✅ Auto-fetched. Check everything, then Save.', 'ok');
    } catch (err) {
      showMsg('Error: ' + err.message, 'err');
    }
  });

  $('#save-btn').addEventListener('click', async function () {
    var name = $('#in-name').value.trim();
    var date = $('#in-date').value;
    if (!name || !date) { showMsg('Name and release date are required.', 'err'); return; }

    var tracklist = [];
    document.querySelectorAll('.track-input-row input').forEach(function (inp) {
      var v = inp.value.trim();
      if (v) tracklist.push(v);
    });

    try {
      var res = await fetch('/api/songs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name,
          artist: $('#in-artist').value.trim(),
          featured: $('#in-featured').value.trim(),
          cover: $('#in-cover').value.trim(),
          release_date: date,
          type: $('#in-type').value,
          total_tracks: parseInt($('#in-tracks').value, 10) || 1,
          tracklist: tracklist,
          genre: $('#in-genre').value.trim(),
          label: $('#in-label').value.trim(),
          producer: $('#in-producer').value.trim(),
          spotify_url: currentUrl.includes('spotify') ? currentUrl : '',
          apple_url: currentUrl.includes('apple') ? currentUrl : ''
        })
      });

      if (!res.ok) {
        var err = await res.json();
        throw new Error(err.error || 'Save failed');
      }

      $('#sp-link').value = '';
      currentUrl = '';
      $('#preview-box').classList.remove('show');
      $('#form-fields').style.display = 'none';
      $('#tracklist-container').innerHTML = '';
      showMsg('✅ Release saved!', 'ok');
      renderList();
    } catch (err) {
      showMsg('Error: ' + err.message, 'err');
    }
  });

  function showMsg(text, type) {
    var msg = $('#admin-msg');
    msg.textContent = text;
    msg.className = 'admin-msg ' + type + ' show';
  }

  async function renderList() {
    try {
      var res = await fetch('/api/songs');
      var list = await res.json();
      var el = $('#release-list');
      if (!list || !list.length) {
        el.innerHTML = '<p style="color: var(--muted); font-size: 0.85rem;">No releases added yet.</p>';
        return;
      }
      el.innerHTML = list.map(function (s) {
        var feat = s.featured ? ' (feat. ' + s.featured + ')' : '';
        return '' +
          '<div class="admin-song">' +
            '<img src="' + (s.cover || '') + '" alt="">' +
            '<div class="info">' +
              '<h4>' + s.name + feat + '</h4>' +
              '<p>' + s.type + ' · ' + s.total_tracks + ' track(s) · ' + s.release_date + '</p>' +
            '</div>' +
            '<button class="del" data-id="' + s.id + '">✕</button>' +
          '</div>';
      }).join('');

      document.querySelectorAll('.del').forEach(function (b) {
        b.addEventListener('click', async function () {
          if (!confirm('Delete this release?')) return;
          var id = b.getAttribute('data-id');
          await fetch('/api/songs?id=' + id, { method: 'DELETE' });
          renderList();
        });
      });
    } catch (err) {
      console.error(err);
    }
  }
})();
</script>

</body>
</html>
