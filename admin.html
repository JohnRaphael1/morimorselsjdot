<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | MoriMorsels JDot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.admin-wrap { max-width: 720px; margin: 0 auto; }
.admin-card {
  background: var(--glass-bg-strong);
  backdrop-filter: var(--glass-blur-strong);
  -webkit-backdrop-filter: var(--glass-blur-strong);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 36px;
  box-shadow: 0 0 40px rgba(139, 0, 0, 0.2);
}
.admin-card h2 {
  font-family: var(--font-display);
  font-size: 1.6rem;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin-bottom: 24px;
  color: var(--text-bright);
}
.admin-input {
  width: 100%;
  padding: 13px 16px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  color: #fff;
  font-family: var(--font-body);
  font-size: 0.9rem;
  transition: all 0.3s var(--ease);
}
.admin-input:focus {
  outline: none;
  border-color: var(--red-bright);
  box-shadow: 0 0 20px rgba(139, 0, 0, 0.45);
}
.admin-label {
  display: block;
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--red-bright);
  margin-bottom: 8px;
  margin-top: 18px;
}
.admin-msg {
  padding: 14px;
  border-radius: 8px;
  margin-top: 20px;
  font-size: 0.85rem;
  display: none;
}
.admin-msg.show { display: block; }
.admin-msg.ok { background: rgba(0, 128, 0, 0.15); border: 1px solid #0a5c0a; color: #7fdc7f; }
.admin-msg.err { background: rgba(139, 0, 0, 0.15); border: 1px solid var(--red-1); color: #ff9e9e; }
.preview-box {
  display: none;
  margin-top: 20px;
  padding: 18px;
  border-radius: 10px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  gap: 16px;
  align-items: center;
}
.preview-box.show { display: flex; }
.preview-box img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; }
.preview-box .pv-info h4 { color: #fff; font-size: 1rem; margin-bottom: 4px; }
.preview-box .pv-info p { color: var(--muted); font-size: 0.75rem; }
.admin-song {
  display: grid;
  grid-template-columns: 60px 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 14px;
  margin-bottom: 10px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
}
.admin-song img { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; }
.admin-song .info h4 { color: #fff; font-size: 0.9rem; margin-bottom: 3px; }
.admin-song .info p { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; }
.admin-song .del {
  background: rgba(139, 0, 0, 0.3);
  border: 1px solid var(--red-1);
  color: #ff9e9e;
  width: 34px; height: 34px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 0.95rem;
}
.admin-song .del:hover { background: var(--red-bright); color: #fff; }
.track-list-preview {
  margin-top: 10px;
  padding: 12px;
  background: rgba(0,0,0,0.4);
  border-radius: 8px;
  max-height: 200px;
  overflow-y: auto;
}
.track-list-preview li {
  list-style: none;
  padding: 4px 0;
  color: var(--muted);
  font-size: 0.8rem;
}
.track-list-preview li::before { content: '♪ '; color: var(--red-bright); }
@media (max-width: 640px) {
  .admin-card { padding: 22px; }
}
</style>
</head>
<body>

<div class="bg-layer bg-gradient"></div>
<div class="bg-layer bg-glow"></div>
<div class="bg-layer bg-noise"></div>
<canvas id="particles"></canvas>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-logo">
      <span class="logo-mark">M</span>
      <span class="logo-text">MORIMORSELS <em>JDOT</em></span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="music.html">Music</a></li>
      <li><a href="videos.html">Videos</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="songs.html">All Songs</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="admin.html" class="active">Admin</a></li>
    </ul>
    <button class="nav-toggle" aria-label="Menu">☰</button>
  </div>
</nav>

<div id="login-screen" class="section" style="padding-top: 140px;">
  <div class="container">
    <div class="admin-wrap">
      <div class="admin-card">
        <h2>Admin Login</h2>
        <label class="admin-label">Login ID</label>
        <input id="login-id" class="admin-input" type="text" placeholder="Enter login ID">
        <label class="admin-label">Password</label>
        <input id="login-pass" class="admin-input" type="password" placeholder="Enter password">
        <button id="login-btn" class="btn btn-primary full" style="margin-top: 20px;">Login</button>
        <div id="login-msg" class="admin-msg err"></div>
      </div>
    </div>
  </div>
</div>

<div id="admin-panel" class="section" style="padding-top: 140px; display: none;">
  <div class="container">
    <div class="admin-wrap">
      <div class="admin-card">
        <h2>Add a Release</h2>

        <label class="admin-label">Paste Spotify or Apple Music Link</label>
        <input id="sp-link" class="admin-input" type="text" placeholder="https://open.spotify.com/... OR https://music.apple.com/...">
        <button id="fetch-btn" class="btn btn-primary full" style="margin-top: 14px;">Auto-Fetch & Add</button>

        <div id="preview-box" class="preview-box">
          <img id="pv-img" src="" alt="">
          <div class="pv-info">
            <h4 id="pv-title">—</h4>
            <p id="pv-artist">—</p>
            <p id="pv-meta" style="color: var(--muted); font-size: 0.7rem; margin-top: 4px;"></p>
          </div>
        </div>

        <div id="tracklist-preview" style="display: none;">
          <label class="admin-label">Tracklist Preview</label>
          <ul class="track-list-preview" id="tracklist-ul"></ul>
        </div>

        <div id="admin-msg" class="admin-msg"></div>

        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--glass-border);">
          <p style="font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em;">Manual fields (if needed)</p>
          <label class="admin-label">Producer</label>
          <input id="in-producer" class="admin-input" type="text" placeholder="Producer name">
          <label class="admin-label">Record Label</label>
          <input id="in-label" class="admin-input" type="text" placeholder="Label name">
          <label class="admin-label">Genre</label>
          <input id="in-genre" class="admin-input" type="text" placeholder="e.g. Drill, Trap, Hip-Hop">
        </div>
      </div>

      <div class="admin-list" style="margin-top: 40px;">
        <h2 style="font-family: var(--font-display); color: #fff; text-transform: uppercase; margin-bottom: 20px;">Added Releases</h2>
        <div id="release-list"></div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>

<script>
(function () {
  'use strict';

  var ADMIN_ID = 'MMJD2026';
  var ADMIN_PASS = 'MMJDOT';

  var $ = function (s) { return document.querySelector(s); };

  if (localStorage.getItem('mmjd_logged') === 'yes') {
    showPanel();
  }

  $('#login-btn').addEventListener('click', function () {
    var id = $('#login-id').value.trim();
    var pw = $('#login-pass').value.trim();
    if (id === ADMIN_ID && pw === ADMIN_PASS) {
      localStorage.setItem('mmjd_logged', 'yes');
      showPanel();
    } else {
      var msg = $('#login-msg');
      msg.textContent = 'Wrong login ID or password.';
      msg.className = 'admin-msg err show';
    }
  });

  function showPanel() {
    $('#login-screen').style.display = 'none';
    $('#admin-panel').style.display = 'block';
    renderList();
  }

  // ---------- AUTO FETCH ----------
  $('#fetch-btn').addEventListener('click', async function () {
    var url = $('#sp-link').value.trim();
    if (!url) { showMsg('Paste a link first.', 'err'); return; }

    showMsg('Fetching data...', 'ok');

    try {
      var res = await fetch('/api/songs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'fetch', url: url })
      });

      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Fetch failed');

      // Show preview
      $('#pv-img').src = data.cover || '';
      $('#pv-title').textContent = data.name || '—';
      $('#pv-artist').textContent = data.artist + (data.featured ? ' feat. ' + data.featured : '');
      $('#pv-meta').textContent = data.type.toUpperCase() + ' · ' + data.total_tracks + ' Songs · ' + data.release_date;
      $('#preview-box').classList.add('show');

      // Tracklist preview
      if (data.tracklist && data.tracklist.length > 0) {
        $('#tracklist-ul').innerHTML = data.tracklist.map(function (t) {
          return '<li>' + t + '</li>';
        }).join('');
        $('#tracklist-preview').style.display = 'block';
      } else {
        $('#tracklist-preview').style.display = 'none';
      }

      // Auto-save
      var saveRes = await fetch('/api/songs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: data.name,
          artist: data.artist,
          featured: data.featured,
          cover: data.cover,
          release_date: data.release_date,
          type: data.type,
          total_tracks: data.total_tracks,
          tracklist: data.tracklist,
          spotify_url: url.includes('spotify') ? url : '',
          apple_url: url.includes('apple') ? url : '',
          producer: $('#in-producer').value.trim(),
          label: $('#in-label').value.trim(),
          genre: $('#in-genre').value.trim(),
        })
      });

      if (!saveRes.ok) throw new Error('Save failed');

      // Reset
      $('#sp-link').value = '';
      $('#in-producer').value = '';
      $('#in-label').value = '';
      $('#in-genre').value = '';
      showMsg('✅ Release added!', 'ok');
      renderList();

    } catch (err) {
      showMsg('Error: ' + err.message, 'err');
    }
  });

  function showMsg(text, type) {
    var msg = $('#admin-msg');
    msg.textContent = text;
    msg.className = 'admin-msg ' + type + ' show';
  }

  async function renderList() {
    try {
      var res = await fetch('/api/songs');
      var list = await res.json();
      var el = $('#release-list');
      if (!list || !list.length) {
        el.innerHTML = '<p style="color: var(--muted); font-size: 0.85rem;">No releases added yet.</p>';
        return;
      }
      el.innerHTML = list.map(function (s) {
        var feat = s.featured ? ' (feat. ' + s.featured + ')' : '';
        return '' +
          '<div class="admin-song">' +
            '<img src="' + (s.cover || '') + '" alt="">' +
            '<div class="info">' +
              '<h4>' + s.name + feat + '</h4>' +
              '<p>' + s.type + ' · ' + s.total_tracks + ' song' + (s.total_tracks > 1 ? 's' : '') + ' · ' + s.release_date + '</p>' +
            '</div>' +
            '<button class="del" data-id="' + s.id + '">✕</button>' +
          '</div>';
      }).join('');

      document.querySelectorAll('.del').forEach(function (b) {
        b.addEventListener('click', async function () {
          if (!confirm('Delete this release?')) return;
          var id = b.getAttribute('data-id');
          await fetch('/api/songs?id=' + id, { method: 'DELETE' });
          renderList();
        });
      });
    } catch (err) {
      console.error(err);
    }
  }
})();
</script>

</body>
</html>
